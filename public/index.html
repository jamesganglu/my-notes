<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes</title>
  <link rel="stylesheet" id="hljs-theme" href="/vendor/hljs/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Apply the saved theme before first paint so the page doesn't flash dark.
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('notes.theme') || 'dark'; } catch (e) {}
      if (theme === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.getElementById('hljs-theme').href = '/vendor/hljs/styles/github.min.css';
      }
    })();
  </script>
</head>
<body>
  <aside class="sidebar">
    <button id="new-note" class="primary">+ New note</button>
    <input id="search" type="search" placeholder="Search…" autocomplete="off" />

    <h3>Type</h3>
    <ul id="type-filter" class="filter">
      <li data-value="">All</li>
      <li data-value="text">Plain text</li>
      <li data-value="markdown">Markdown</li>
      <li data-value="code">Code</li>
      <li data-value="password">Passwords</li>
      <li data-value="changelog">Change logs</li>
      <li data-value="todo">To-do lists</li>
    </ul>

    <h3>Categories</h3>
    <ul id="category-filter" class="filter"></ul>

    <h3>Tags</h3>
    <div id="tag-filter" class="tag-cloud"></div>

    <h3>Export</h3>
    <div class="export">
      <a class="button" href="/api/export/postgres/schema" download
         title="CREATE TABLE statements for an empty PostgreSQL database">Postgres schema</a>
      <a class="button" href="/api/export/postgres/dump" download
         title="Schema plus all notes, tags and links as PostgreSQL INSERT statements">Postgres dump</a>
    </div>

    <h3>Security</h3>
    <button type="button" id="change-pin" title="The PIN is needed to reveal or copy passwords">Set PIN</button>

    <h3>Theme</h3>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="light">White</button>
      <button type="button" data-theme-choice="dark">Dark</button>
    </div>
  </aside>

  <section class="list">
    <div id="active-filters" class="active-filters"></div>
    <ul id="note-list"></ul>
  </section>

  <main id="detail" class="detail">
    <div class="empty">Select a note or create a new one.</div>
  </main>

  <div id="pin-modal" class="modal" hidden>
    <form class="modal-box" autocomplete="off" novalidate>
      <h2 class="pin-title"></h2>
      <p class="pin-text"></p>
      <input name="current" type="password" inputmode="numeric" maxlength="8" placeholder="Current PIN" aria-label="Current PIN" />
      <input name="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="PIN" />
      <input name="confirm" type="password" inputmode="numeric" maxlength="8" placeholder="Repeat new PIN" aria-label="Repeat new PIN" />
      <p class="pin-error" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary pin-submit">OK</button>
        <button type="button" class="pin-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <template id="view-tpl">
    <header class="detail-head">
      <div>
        <h1 class="v-title"></h1>
        <div class="meta">
          <span class="badge v-type"></span>
          <span class="v-category"></span>
          <span class="v-dates"></span>
        </div>
        <div class="v-tags tags"></div>
      </div>
      <div class="actions">
        <button class="v-print">Print</button>
        <button class="v-edit">Edit</button>
        <button class="v-delete danger">Delete</button>
      </div>
    </header>
    <div class="v-body"></div>
  </template>

  <template id="edit-tpl">
    <form class="editor">
      <input name="title" placeholder="Title" required />
      <div class="row">
        <select name="type">
          <option value="text">Plain text</option>
          <option value="markdown">Markdown</option>
          <option value="code">Code snippet</option>
          <option value="password">Password</option>
          <option value="changelog">Change log</option>
          <option value="todo">To-do list</option>
        </select>
        <div class="cat-picker">
          <select name="category" aria-label="Category"></select>
          <div class="cat-new" hidden>
            <input class="cat-input" placeholder="New category name" autocomplete="off" />
            <button type="button" class="cat-add">Add</button>
            <button type="button" class="cat-cancel">Cancel</button>
          </div>
        </div>
        <input name="language" class="only-code" placeholder="Language (e.g. js, python)" />
      </div>
      <div class="tag-picker">
        <div class="tp-selected"></div>
        <div class="tp-add">
          <input class="tp-input" placeholder="Filter or add a tag…" autocomplete="off" />
          <button type="button" class="tp-add-btn">Add tag</button>
        </div>
        <ul class="tp-list" role="listbox" aria-multiselectable="true" aria-label="Tags"></ul>
      </div>
      <div class="row only-password">
        <input name="username" placeholder="Username / email" autocomplete="off" />
        <input name="url" placeholder="URL" autocomplete="off" />
      </div>
      <div class="only-password pw-row">
        <input name="password" type="password" placeholder="Password" autocomplete="new-password" />
        <button type="button" class="pw-toggle">Show</button>
        <button type="button" class="pw-generate">Generate</button>
      </div>
      <textarea name="content" class="content-field" placeholder="Write your note…" spellcheck="false"></textarea>
      <div class="changelog-editor only-changelog"></div>
      <div class="todo-editor only-todo"></div>
      <div class="md-preview only-markdown"></div>
      <div class="actions">
        <button type="submit" class="primary">Save</button>
        <button type="button" class="cancel">Cancel</button>
      </div>
    </form>
  </template>

  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
  <script src="/vendor/hljs/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
